name: Release Please

on:
  push:
    branches: [main]

# contents 用於打 tag 與建 Release，pull-requests 用於開／更新 Release PR，
# issues 用於貼標籤
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
