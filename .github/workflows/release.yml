name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # 手動觸發：只建置不發佈，用於驗證流程

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile AI engine
        working-directory: src
        run: python utils/build.py

      - name: Install Python deps
        run: pip install -r requirements.txt

      # 門檻排在打包之前，引擎有問題就不該產出執行檔
      - name: Smoke test
        working-directory: src
        run: python utils/smoke_test.py ./ai.dll

      - name: Run tests
        run: pytest

      # 打包設定全在 Gomuko.spec，改 UI 或資源檔不必動這份 workflow
      - name: Build executable
        working-directory: src
        run: pyinstaller Gomuko.spec

      # 前面的關卡測的都是原始碼樹，打包漏檔案不會被發現。
      # 不實際啟動 GUI：CI 沒有互動桌面，視窗跑不起來不代表打包有問題。
      - name: Verify packaged executable
        run: python utils/verify_bundle.py dist/Gomoku-windows.exe
        working-directory: src

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/dist/Gomoku-windows.exe
          # release-please 已建好含 CHANGELOG 的 Release，這裡只附加安裝說明。
          # 不加 append_body 的話 body 會覆蓋掉 CHANGELOG。
          append_body: true
          body: |
            ## 安裝與執行 / Installation

            下載 `Gomoku-windows.exe` 後直接雙擊執行，不需安裝 Python。
            首次執行可能被 Windows SmartScreen 攔下（未簽章執行檔），點「其他資訊」→「仍要執行」即可。

            Download `Gomoku-windows.exe` and double-click to run. No Python installation required.
            Windows SmartScreen may block it on first launch (unsigned executable): click "More info" → "Run anyway".

      - name: Upload artifact (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Gomoku-windows-testbuild
          path: src/dist/Gomoku-windows.exe
